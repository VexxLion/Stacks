<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Stacks</title>
<meta name="theme-color" content="#17171a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="header-top">
      <h1 class="app-title">Stacks<span class="dot">.</span></h1>
      <div class="header-actions">
        <button class="header-icon-btn" id="statsBtn" title="Stats" aria-label="Stats">📊</button>
        <button class="header-icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☾</button>
      </div>
    </div>
    <div class="app-sub" id="subline">your queue, off the algorithm</div>
    <div class="search-row">
      <input class="search-input" id="search" type="text" placeholder="Search saved titles, channels, notes…" />
    </div>
    <div class="chip-row" id="catChips"></div>
    <div class="chip-row" id="plChips"></div>
    <div class="manage-row">
      <button class="text-btn" id="manageTagsBtn">✎ Manage categories &amp; playlists</button>
    </div>
  </header>

  <input type="file" id="importFile" accept="application/json" style="display:none;" />

  <div class="count-line-row">
    <div class="count-line" id="countLine">0 saved</div>
    <div style="display:flex; gap:12px;">
      <button class="text-btn" id="selectModeBtn">Select</button>
      <button class="text-btn" id="sortBtn">Newest ▾</button>
    </div>
  </div>
  <div class="list" id="list"></div>

  <div class="backup-row">
    <button class="text-btn" id="exportBtn">Export backup</button>
    <span>·</span>
    <button class="text-btn" id="importBtn">Import backup</button>
  </div>
</div>

<button class="fab" id="fabAdd" aria-label="Add link">+</button>

<div class="toast" id="undoToast">
  <span class="msg" id="undoMsg"></span>
  <button id="undoBtn">Undo</button>
</div>

<div class="bulk-bar" id="bulkBar">
  <span class="bulk-count" id="bulkCount">0 selected</span>
  <button class="btn ghost" id="bulkCategoryBtn">Category</button>
  <button class="btn ghost" id="bulkPlaylistBtn">Playlist</button>
  <button class="btn danger" id="bulkDeleteBtn">Delete</button>
</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h3 id="sheetTitle">Add a link</h3>
    <div class="field">
      <label for="fUrl">YouTube link</label>
      <input type="url" id="fUrl" placeholder="https://youtube.com/watch?v=…" />
    </div>
    <div class="field">
      <label for="fTitleField">Title</label>
      <input type="text" id="fTitleField" placeholder="Fetched automatically, or type your own" />
    </div>
    <div class="field">
      <label for="fNote">Note (optional)</label>
      <textarea id="fNote" rows="2" placeholder="Skip to the demo part, watch before Friday…"></textarea>
    </div>
    <div class="field">
      <label>Category</label>
      <div class="tag-picker" id="catPicker"></div>
    </div>
    <div class="field">
      <label>Playlists</label>
      <div class="tag-picker" id="plPicker"></div>
    </div>
    <div class="field">
      <label>Priority</label>
      <div class="tag-picker">
        <button type="button" class="tag-option" id="pinToggle">★ Pin to top</button>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
    <div class="sheet-actions" id="deleteRow" style="display:none;">
      <button class="btn danger" id="deleteBtn">Delete this link</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="manageBackdrop">
  <div class="sheet">
    <h3>Manage tags</h3>
    <div class="field">
      <label>Categories</label>
      <div class="manage-list" id="manageCats"></div>
    </div>
    <div class="field">
      <label>Playlists</label>
      <div class="manage-list" id="managePls"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn primary" id="manageCloseBtn">Done</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="bulkTagBackdrop">
  <div class="sheet">
    <h3 id="bulkTagTitle">Set category</h3>
    <div class="field">
      <div class="tag-picker" id="bulkTagPicker"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="bulkTagCancel">Cancel</button>
      <button class="btn primary" id="bulkTagApply">Apply</button>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="statsBackdrop">
  <div class="sheet">
    <h3>Your stats</h3>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="sheet-actions">
      <button class="btn primary" id="statsCloseBtn">Close</button>
    </div>
  </div>
</div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
